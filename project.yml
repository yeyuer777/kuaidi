name: PickupCode
options:
  bundleIdPrefix: com.pickupcode
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    # 显式锁成 minimal：本项目用 @MainActor 的 Store 被 View 的同步按钮闭包调用，
    # 严格并发检查会把这些报成 error。代码本身在主线程执行，没有真实竞态。
    SWIFT_STRICT_CONCURRENCY: incomplete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_EMIT_LOC_STRINGS: "YES"

targets:
  PickupCode:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: PickupCode
    info:
      path: PickupCode/Info.plist
      properties:
        CFBundleDisplayName: 取件码
        CFBundleName: PickupCode
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: 需要访问相册，用于识别取件码截图。
        NSCameraUsageDescription: 需要访问相机，用于拍摄取件码截图。
        NSPhotoLibraryAddUsageDescription: 需要写入相册以保存图片。
        CFBundleURLTypes:
          - CFBundleURLName: com.pickupcode.app
            CFBundleURLSchemes:
              - pickupcode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pickupcode.app
        PRODUCT_NAME: PickupCode
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"

schemes:
  PickupCode:
    build:
      targets:
        PickupCode: all
    run:
      config: Debug
    archive:
      config: Release
